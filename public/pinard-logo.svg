<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="Pinard — intelligent MRCOG revision">
  <!--
    PINARD brand mark
    Mark: a minimal Pinard stethoscope (the instrument that listens)
          with three "listening arcs" in the heartbeat accent.
    Colours: theatre #0F3D33 · heartbeat #D64562 · sage #EDF3EE
    App icon: use the mark group alone, centred on a #0F3D33 rounded square,
    arcs in #D64562, horn in #FDFDFB.
  -->

  <!-- ===== Mark ===== -->
  <g id="mark">
    <!-- listening arcs -->
    <g fill="none" stroke="#D64562" stroke-width="3" stroke-linecap="round">
      <path d="M59.5 29.8 A15 15 0 0 1 80.5 29.8"/>
      <path d="M53.9 21.8 A23 23 0 0 1 86.1 21.8" opacity="0.72"/>
      <path d="M48.3 13.8 A31 31 0 0 1 91.7 13.8" opacity="0.44"/>
    </g>

    <!-- the horn, from the outline the landing page draws (scripts/logo-from-horn.mjs) -->
    <ellipse cx="70" cy="43.94" rx="15.66" ry="5.36" fill="#0F3D33"/>
    <path d="M54.34 41.66 A15.66 5.36 0 0 1 85.66 41.66 L85.66 43.94 A15.66 5.36 0 0 0 54.34 43.94 Z" fill="#0F3D33"/>
    <path d="M49.96 109.14 L50.69 108.42 51.75 107.31 52.9 105.97 54.07 104.46 55.2 102.81 56.27 101.05 57.27 99.18 58.2 97.21 59.05 95.15 59.83 93.01 60.54 90.79 61.2 88.51 61.8 86.15 62.35 83.73 62.84 81.25 63.3 78.71 63.7 76.12 64.06 73.47 64.37 70.77 64.64 68.02 64.86 65.22 65.03 62.37 65.16 59.48 65.25 56.54 65.29 53.56 65.3 50.54 65.22 48.74 64.93 47.29 64.32 46.14 63.3 45.28 61.77 44.65 59.64 44.23 L80.36 44.23 78.23 44.65 76.7 45.28 75.68 46.14 75.07 47.29 74.78 48.74 74.7 50.54 74.71 53.56 74.75 56.54 74.84 59.48 74.97 62.37 75.14 65.22 75.36 68.02 75.63 70.77 75.94 73.47 76.3 76.12 76.7 78.71 77.16 81.25 77.65 83.73 78.2 86.15 78.8 88.51 79.46 90.79 80.17 93.01 80.95 95.15 81.8 97.21 82.73 99.18 83.73 101.05 84.8 102.81 85.93 104.46 87.1 105.97 88.25 107.31 89.31 108.42 90.04 109.14 A20.04 6.86 0 0 1 49.96 109.14 Z" fill="#0F3D33"/>
    <ellipse cx="70" cy="109.14" rx="20.04" ry="6.86" fill="#0F3D33"/>
    <ellipse cx="70" cy="109.39" rx="17.24" ry="5.48" fill="#EDF3EE"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="138" y="96" fill="#0F3D33" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" letter-spacing="0.5">Pinard</text>

  <!-- tagline -->
  <text x="141" y="124" fill="#2F6D5B" font-family="'Albert Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2">INTELLIGENT MRCOG REVISION</text>
</svg>
