# Picks up what Admin leaves unfinished: questions asked for from a source,
# a search for decision aids, a revision of marked aids.
#
# A manual run only. Supabase Cron makes these calls every 2 minutes
# (supabase/phase54-cron.sql), because GitHub's schedule ran this twice in 17
# hours. A press in Admin does the work; Cron catches what is left.
# Why not a function carrying on by itself: one that called itself was
# stopped at its fourth run on the live site (5 November 2026). A Vercel
# Hobby cron runs once a day.
#
# Each call answers at once and does its work afterwards, up to a few
# minutes. A call with nothing to do costs a few milliseconds. The output
# here is public: it prints status codes and nothing else.
#
# It uses the CRON_SECRET repository secret that the reminders already use.

name: Background work

on:
  # So it can be tried from the Actions tab without waiting.
  workflow_dispatch:

concurrency:
  group: background-work
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Start what is waiting
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set as a repository secret."
            exit 1
          fi

          call() {
            curl --silent --show-error --max-time 30 --retry 2 --retry-delay 10 \
              --request POST \
              --header "authorization: Bearer $CRON_SECRET" \
              --header "content-type: application/json" \
              --data "$2" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://pinardapp.com/$1" || true
          }

          failed=0
          for target in "api/generate/worker?long=1" "api/decision-aids/revise" "api/decision-aids/search"; do
            code=$(call "$target" '{"continue":true}')
            echo "$target: HTTP $code"
            case "$code" in
              2*) ;;
              *) failed=1 ;;
            esac
          done
          exit $failed
