# The 07:00 reminder, sent in each candidate's own morning.
#
# Why this is not a Vercel cron. The reminder has to run every hour to
# reach 07:00 in every timezone, and a Vercel Hobby plan allows one run
# a day per job. Asking for an hourly schedule there is not merely
# ignored: vercel.json is validated before any build, so the whole
# deployment is rejected at configuration and no deployment record is
# created. That cost a day of failed deployments once already.
#
# This repository is public, so scheduled Actions on it are free and
# unmetered, and one curl an hour is the whole of the work.
#
# What it needs, once: a repository secret named CRON_SECRET holding
# the same value as the CRON_SECRET environment variable in Vercel.
# Settings -> Secrets and variables -> Actions -> New repository secret.
# Without it the endpoint falls back to requiring an admin session and
# every run returns 401, which shows up here as a failed job rather
# than as silence.
#
# Two things worth knowing about GitHub's scheduler. It is best-effort
# and can run several minutes late under load, which is why the
# endpoint accepts a three-hour window rather than insisting on the
# exact hour. And on a public repository a scheduled workflow is
# disabled after 60 days without a commit, with a warning by email
# first; a single commit re-enables it.

name: Daily reminders

on:
  schedule:
    # Every hour, on the hour, UTC. Each run sends only to candidates
    # whose own 07:00 has just passed and who have not been sent today,
    # so twenty-four runs produce at most one email each.
    - cron: "0 * * * *"
  # So it can be tried from the Actions tab without waiting an hour.
  workflow_dispatch:

# One run at a time. A slow run must not overlap the next hour's and
# have both decide the same candidate is unsent.
concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set as a repository secret."
            echo "The endpoint will refuse the call, so this fails here"
            echo "rather than reporting a green run that sent nothing."
            exit 1
          fi

          # Status and body separately, so the one expected non-2xx can
          # be told from every other one. --fail-with-body alone made
          # them identical: a missing email key and a broken deployment
          # both came out as a red job saying nothing useful.
          code=$(curl --silent --show-error             --max-time 300             --retry 2 --retry-delay 30 --retry-connrefused             --header "authorization: Bearer $CRON_SECRET"             --output response.json             --write-out "%{http_code}"             https://pinardapp.com/api/reminders) || true

          echo "HTTP $code"
          cat response.json || true
          echo

          # Waiting for email keys that have not been created yet. Real,
          # expected, and nothing to do about it from here, so it says
          # so and passes. Going red hourly for a state the owner chose
          # would train everyone to ignore the red.
          if [ "$code" = "503" ] && grep -q "email_not_configured" response.json; then
            echo "::warning::Reminders are not being sent: RESEND_API_KEY and RESEND_FROM are not set. Everything else in the chain is working."
            exit 0
          fi

          case "$code" in
            2*) echo "Reminder run completed." ;;
            *)  echo "::error::The reminder endpoint answered $code."; exit 1 ;;
          esac
